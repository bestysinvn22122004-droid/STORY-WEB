<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản Trị - Web Truyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-gray-200 overflow-hidden">
        <div class="p-8 bg-gradient-to-tr from-amber-600 to-orange-500 text-white text-center">
            <div class="w-12 h-12 bg-white/20 rounded-2xl mx-auto flex items-center justify-center mb-3">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-2xl font-black">Bảng Quản Trị Hệ Thống</h1>
            <p class="text-xs text-amber-100 mt-1">Quản lý truyện & Cấu hình vị trí chèn quảng cáo</p>
        </div>

        <div class="p-8">
            {% if error %}
            <div class="mb-6 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl font-medium">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <form action="/admin/login" method="post" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Mật khẩu quản trị</label>
                    <input type="password" name="password" required autofocus placeholder="Nhập mật khẩu (Mặc định: admin123)"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:bg-white focus:border-amber-500 focus:outline-none transition">
                </div>

                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-orange-500/20 transition active:scale-95 text-sm">
                    Đăng Nhập Quản Trị
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/" class="text-xs text-gray-500 hover:text-amber-600 font-medium transition">← Quay lại trang chủ website</a>
            </div>
        </div>
    </div>
</body>
</html>
